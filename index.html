<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kartu Gosok Ka Iyan 🎁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#05060f}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#eee7ff;min-height:100svh;overflow-x:hidden}
body.lock{overflow:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:
radial-gradient(60% 50% at 15% 10%,rgba(124,58,237,.45),transparent 60%),
radial-gradient(50% 45% at 90% 30%,rgba(236,72,153,.30),transparent 60%),
radial-gradient(60% 50% at 50% 100%,rgba(14,165,233,.30),transparent 60%),#05060f;
background-size:150% 150%;animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{from{background-position:0 0}to{background-position:100% 100%}}
.st{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;z-index:-1;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.fl{position:fixed;bottom:-50px;z-index:-1;opacity:0;pointer-events:none;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#pg{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.1);z-index:50}
#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fe3ff,#c4a1ff,#ff9ed2,#ffd98a);
box-shadow:0 0 12px rgba(196,161,255,.9);transition:width .6s}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 22px 50px}
#stage{width:100%;max-width:460px;text-align:center}
.slide{animation:inR .65s cubic-bezier(.2,.8,.2,1)}
.slide.back{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) scale(.96)}to{opacity:1;transform:none}}
.small{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#ffd98a;text-shadow:0 0 12px rgba(255,217,138,.5)}
h2{font-size:clamp(28px,8vw,44px);line-height:1.15;margin:14px 0 18px;font-weight:900;
background:linear-gradient(90deg,#fff2cf,#ffd98a,#ff9ed2,#8fe3ff,#fff2cf);background-size:300% 100%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;
filter:drop-shadow(0 0 18px rgba(255,190,120,.35))}
@keyframes shine{to{background-position:300% 0}}
.lead{font-size:18px;line-height:1.7;color:#e7ddff}
.sig{margin-top:22px;color:#ff9ed2;font-size:15px}
.k{position:relative;min-height:180px;margin:22px 0 12px;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;
padding:26px;font-size:20px;line-height:1.6;color:#fff;font-weight:600;
background:linear-gradient(135deg,rgba(124,58,237,.38),rgba(236,72,153,.28));border:1px solid rgba(255,217,138,.45);
box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 50px rgba(150,100,255,.25)}
.k canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .7s}
.k canvas.gone{opacity:0;pointer-events:none}
.hint{font-size:14px;color:#bfb2e6;min-height:1.4em;animation:bl 1.8s ease-in-out infinite}
@keyframes bl{50%{opacity:.4}}
.cake{font-size:84px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
nav{display:flex;gap:12px;justify-content:center;margin-top:26px}
.btn{padding:12px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:16px;cursor:pointer;
background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 8px 30px rgba(124,58,237,.5);transition:.25s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:24px;text-align:center;background:#05060f;transition:opacity .9s}
#start.off{opacity:0;pointer-events:none}
#start .e{font-size:64px;animation:bob 1.6s ease-in-out infinite}
#mbtn{position:fixed;top:14px;right:14px;z-index:90;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-size:18px;cursor:pointer}
.cf{position:fixed;top:-20px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body class="lock">
<div class="bg"></div>
<div id="pg"><i></i></div>

<div id="start">
<div class="e">🎁</div>
<p class="small" style="margin-top:18px">Ada kartu rahasia buat lo</p>
<h2 style="margin-top:10px">Ka Iyan</h2>
<button class="btn" id="go">Buka kejutan</button>
</div>
<button id="mbtn" aria-label="musik">🔊</button>

<main><div id="stage"></div>
<nav><button class="btn ghost" id="back">← Balik</button><button class="btn" id="next">Lanjut →</button></nav>
</main>

<script>
/* ===== ISI KARTU: ganti / tambah sesuai pesan yang mau lo kasih ===== */
const S=[
 {l:'Pembuka',m:'Selamat ulang tahun, Ka Iyan! 🎂'},
 {l:'Dari gw',m:'Hari ini punya lo. Gw bikin ini khusus buat lo, jadi gosoknya pelan-pelan ya.'},
 {l:'Doa 1',m:'Semoga umur baru ini lo makin sehat dan makin bahagia.'},
 {l:'Doa 2',m:'Buat urusan kuliah, semoga lancar dan nilainya manis, kayak lo wkwk 📚 Gw yakin sih, yang semanis lo pasti disayang dosen juga 😂'},
 {l:'Doa 3',m:'Buat organisasi lo, semoga makin solid dan ngurusnya makin gampang. 🤝'},
 {l:'Perhatian kecil',m:'Jangan lupa makan, istirahat, dan minum air putih ya, sesibuk apa pun.'},
 {l:'Doa 4',m:'Semoga semua yang lagi lo kejar satu-satu kecapai. 🚀'},
 {l:'Penutup',m:'Sekali lagi, selamat ulang tahun, Ka Iyan! Semoga hari ini nyenengin banget. 🎉'}
];
let idx=0,done=[],started=false;
const N=S.length,stage=document.getElementById('stage');
const nextB=document.getElementById('next'),backB=document.getElementById('back');

for(let i=0;i<60;i++){const s=document.createElement('div');s.className='st';
s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
s.style.animationDelay=(Math.random()*3)+'s';document.body.appendChild(s);}
['🎈','✨','💙','⭐','🎂','💜','🎉'].forEach((e,i)=>{const f=document.createElement('div');f.className='fl';f.textContent=e;
f.style.left=(8+i*13)+'vw';f.style.fontSize=(18+Math.random()*18)+'px';
f.style.animationDuration=(15+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*15)+'s';document.body.appendChild(f);});

function confetti(n){
 const em=['🎉','✨','💙','🎂','⭐','🎈'],col=['#ffd98a','#ff9ed2','#8fe3ff','#c4a1ff','#fff'];
 for(let i=0;i<n;i++){
  const c=document.createElement('div');c.className='cf';
  if(i%3===0){c.textContent=em[Math.floor(Math.random()*em.length)];c.style.fontSize=(14+Math.random()*16)+'px';}
  else{c.style.width=(6+Math.random()*6)+'px';c.style.height=(10+Math.random()*8)+'px';
   c.style.background=col[Math.floor(Math.random()*col.length)];c.style.borderRadius='2px';}
  c.style.left=Math.random()*100+'vw';
  c.style.animationDuration=(3+Math.random()*3.5)+'s';
  c.style.animationDelay=(Math.random()*1)+'s';
  document.body.appendChild(c);setTimeout(()=>c.remove(),8000);
 }
}

/* ===== kartu gosok ===== */
function attach(cv,i){
 const r0=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
 cv.width=r0.width*d;cv.height=r0.height*d;
 const x=cv.getContext('2d');x.scale(d,d);
 const g=x.createLinearGradient(0,0,r0.width,r0.height);
 g.addColorStop(0,'#8d93ad');g.addColorStop(.5,'#e3e6f5');g.addColorStop(1,'#9aa0bb');
 x.fillStyle=g;x.fillRect(0,0,r0.width,r0.height);
 x.fillStyle='rgba(60,50,90,.75)';x.font='700 17px system-ui,Arial';x.textAlign='center';x.textBaseline='middle';
 x.fillText('✨ Gosok di sini ✨',r0.width/2,r0.height/2);
 let down=false,lx=0,ly=0,fin=false;
 const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
 cv.onpointerdown=e=>{down=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault();};
 cv.onpointermove=e=>{
  if(!down||fin)return;const [px,py]=pos(e);
  x.globalCompositeOperation='destination-out';x.lineWidth=46;x.lineCap='round';
  x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;
 };
 const up=()=>{
  if(!down||fin)return;down=false;
  const dt=x.getImageData(0,0,cv.width,cv.height).data;let c=0,n=0;
  for(let k=3;k<dt.length;k+=16){n++;if(dt[k]<30)c++;}
  if(c/n>.5){fin=true;done[i]=true;cv.classList.add('gone');confetti(35);
   const h=stage.querySelector('.hint');if(h)h.textContent='';navUpdate();}
 };
 cv.onpointerup=up;cv.onpointercancel=up;
}

/* ===== slide ===== */
function show(i,dir){
 idx=i;
 const el=document.createElement('div');el.className='slide'+(dir<0?' back':'');
 if(i<N){
  const s=S[i];
  el.innerHTML='<p class="small">'+s.l+' · '+(i+1)+' / '+N+'</p><div class="k"><span>'+s.m+'</span>'+
   (done[i]?'':'<canvas></canvas>')+'</div><p class="hint">'+(done[i]?'':'Gosok pake jari ✨')+'</p>';
  stage.innerHTML='';stage.appendChild(el);
  if(!done[i])attach(el.querySelector('canvas'),i);
 }else{
  el.innerHTML='<div class="cake">🎂</div><p class="small">Satu lagi</p><h2>Kado yang aslinya?</h2>'+
   '<p class="lead">Lagi gw pegang sekarang 🎁<br>Tinggal minta aja. 😎</p>'+
   '<p class="sig">— dari seseorang yang sengaja bikin ini buat lo 💙</p>';
  stage.innerHTML='';stage.appendChild(el);confetti(150);
 }
 document.querySelector('#pg i').style.width=Math.min(100,(i/N)*100)+'%';
 navUpdate();
}
function navUpdate(){
 backB.style.visibility=idx>0?'visible':'hidden';
 if(idx>=N){nextB.textContent='Ulangi ↺';nextB.disabled=false;}
 else{nextB.textContent=idx===N-1?'Lanjut →':'Lanjut →';nextB.disabled=!done[idx];}
}
nextB.onclick=()=>{if(idx>=N){done=[];show(0,1);}else if(done[idx])show(idx+1,1);};
backB.onclick=()=>{if(idx>0)show(idx-1,-1);};

/* ===== musik: "Selamat Ulang Tahun" ala kotak musik (WebAudio, tanpa file) =====
   Mau pakai lagu sendiri? Taruh mp3 satu folder lalu isi MUSIC_FILE, misal "lagu.mp3" */
const MUSIC_FILE='';
let ctx,master,timer,musicOn=false,audio=null;
const F={G3:196,G2:98,B3:246.94,D4:293.66,C3:130.81,C4:261.63,E4:329.63,G4:392,F2:87.31,A3:220,
 A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const MEL=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
 ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
 ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],
 ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
const C_=['C3','C4','E4'],G_=['G2','B3','D4'],F_=['F2','A3','C4'];
const CH=[C_,G_,G_,C_,C_,F_,F_,C_];
function tone(f,t,d,v){
 [[f,v,d],[f*2,v*.35,d*.5]].forEach(([fr,vv,dd])=>{
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=fr;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vv,t+.01);
  g.gain.exponentialRampToValueAtTime(.0008,t+dd);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dd+.05);
 });
}
function pass(){
 if(!musicOn)return;
 const B=.55,t0=ctx.currentTime+.1;let t=t0;
 MEL.forEach(([n,b])=>{tone(F[n],t,Math.max(b*B*2.4,.7),.2);t+=b*B;});
 CH.forEach((ch,i)=>{const ct=t0+i*3*B;
  tone(F[ch[0]],ct,3*B*1.2,.2);
  [1,2].forEach(k=>ch.slice(1).forEach(n=>tone(F[n],ct+k*B,B*1.1,.05)));});
 timer=setTimeout(pass,(t-ctx.currentTime)*1000+900);
}
function setBtn(){document.getElementById('mbtn').textContent=musicOn?'🔊':'🔇';}
function musicStart(){
 musicOn=true;setBtn();
 if(MUSIC_FILE){audio=audio||Object.assign(new Audio(MUSIC_FILE),{loop:true});audio.play().catch(()=>{});return;}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);}
 if(ctx.state==='suspended')ctx.resume();
 pass();
}
function musicStop(){musicOn=false;setBtn();clearTimeout(timer);if(audio)audio.pause();
 if(master){master.gain.value=0;setTimeout(()=>master.gain.value=.9,50);}}
document.getElementById('mbtn').onclick=()=>musicOn?musicStop():musicStart();

document.getElementById('go').onclick=()=>{
 musicStart();
 document.getElementById('start').classList.add('off');
 document.body.classList.remove('lock');
 confetti(60);show(0,1);
};
show(0,1);
</script>
</body></html>
